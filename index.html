<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobKareGa - Login</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google AdSense -->
    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6079426080698008"
        crossorigin="anonymous">
    </script>

    <script src="index.js" defer></script>
</head>

<body>

    <div class="loginPage">

        <h2>JobKareGa (Login)</h2>

        <div>
            <label for="UserID">User ID</label>
            <input
                id="UserID"
                type="text"
                placeholder="Enter User ID"
                autocomplete="username">
        </div>

        <div>
            <label for="passworddata">Password</label>
            <input
                id="passworddata"
                type="password"
                placeholder="Enter Password"
                autocomplete="current-password">
        </div>

        <button type="button" onclick="loginpage()">
            Log In
        </button>

        <span>
            User ID और Password के लिए Admin से संपर्क करें.
            <br><br>

            <button type="button" id="admin">
                Contact Admin
            </button>
        </span>

    </div>

    <div id="loading" class="loading">
        Please wait ...
    </div>

</body>

</html>
